name: Native database correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-db
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luce-db luce
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap into package build directory
        working-directory: luce-db
        run: python3 tools/bootstrap.py
      - name: Test all six compiler modes
        working-directory: luce-db
        shell: bash
        run: |
          set -o pipefail
          python3 tests/run.py --mode all 2>&1 | tee build/correctness.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-tests-${{ matrix.os }}
          path: luce-db/build/correctness.log
